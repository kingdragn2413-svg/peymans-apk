name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install and Inject Real AppLock & Fullscreen Cutout
        run: |
          rm -rf package.json package-lock.json node_modules android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.peyman.erade",
            "appName": "پیمان اراده",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

          MAIN_FILE=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          MAIN_DIR=$(dirname "$MAIN_FILE")
          PKG_NAME=$(grep -E "^package " "$MAIN_FILE" | sed 's/package //;s/;//' | tr -d '\r\n ')
          echo "Detected Package: $PKG_NAME in $MAIN_DIR"

          cat << EOF > "$MAIN_DIR/StudyTimerService.java"
          package $PKG_NAME;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.List;
          import java.util.SortedMap;
          import java.util.TreeMap;
          import android.app.usage.UsageStats;

          public class StudyTimerService extends Service {
              private static final String CHANNEL_ID = "peyman_applock_channel";
              private Handler handler;
              private Runnable tickRunnable;
              private PowerManager.WakeLock wakeLock;
              public static Ringtone activeRingtone;
              private WindowManager windowManager;
              private LinearLayout lockOverlayView;
              private boolean isOverlayShowing = false;
              private int tickCounter = 0;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "PeymanErade::AppLockWakeLock");
                      wakeLock.acquire(10 * 60 * 60 * 1000L);
                  }
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  handler = new Handler(Looper.getMainLooper());
                  tickRunnable = new Runnable() {
                      @Override
                      public void run() {
                          checkTimerAndAppLock();
                      }
                  };
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      startForeground(1001, buildNotification("⏳ تایمر و قفل برنامه‌های پیمان اراده فعال است"));
                  } catch (Exception e) {}
                  handler.removeCallbacks(tickRunnable);
                  handler.post(tickRunnable);
                  return START_STICKY;
              }

              private void checkTimerAndAppLock() {
                  SharedPreferences prefs = getSharedPreferences("PeymanLockPrefs", MODE_PRIVATE);
                  long endTime = prefs.getLong("lockEndTime", 0);
                  long diffMs = endTime - System.currentTimeMillis();

                  if (endTime == 0) {
                      removeLockOverlay();
                      stopSelf();
                      return;
                  }

                  if (diffMs > 0) {
                      String blockedCsv = prefs.getString("blockedPackages", "");
                      String topPkg = getForegroundPackage();

                      if (topPkg != null && !topPkg.isEmpty()) {
                          if (topPkg.equals(getPackageName())) {
                              removeLockOverlay();
                          } else if (isPackageBlocked(topPkg, blockedCsv)) {
                              showLockOverlay(diffMs / 1000);
                          }
                      }

                      tickCounter++;
                      if (tickCounter % 3 == 0) {
                          long totalSec = diffMs / 1000;
                          long mins = totalSec / 60;
                          long secs = totalSec % 60;
                          String text = "⏳ باقی‌مانده: " + mins + " دقیقه و " + secs + " ثانیه | 🛡️ AppLock فعال";
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          if (nm != null) nm.notify(1001, buildNotification(text));
                      }

                      handler.postDelayed(tickRunnable, 350);
                  } else {
                      prefs.edit().putLong("lockEndTime", 0).apply();
                      removeLockOverlay();
                      triggerAlarm();
                      stopSelf();
                  }
              }

              private boolean isPackageBlocked(String pkg, String csv) {
                  if (csv == null || csv.isEmpty()) return false;
                  String[] items = csv.split(",");
                  for (String item : items) {
                      String t = item.trim();
                      if (!t.isEmpty() && pkg.equalsIgnoreCase(t)) return true;
                  }
                  return false;
              }

              private String getForegroundPackage() {
                  try {
                      UsageStatsManager usm = (UsageStatsManager) getSystemService(Context.USAGE_STATS_SERVICE);
                      if (usm == null) return null;
                      long now = System.currentTimeMillis();
                      UsageEvents events = usm.queryEvents(now - 15000, now);
                      UsageEvents.Event event = new UsageEvents.Event();
                      String lastPkg = null;
                      while (events.hasNextEvent()) {
                          events.getNextEvent(event);
                          if (event.getEventType() == UsageEvents.Event.MOVE_TO_FOREGROUND || event.getEventType() == 1) {
                              lastPkg = event.getPackageName();
                          }
                      }
                      if (lastPkg != null) return lastPkg;

                      List<UsageStats> stats = usm.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, now - 60000, now);
                      if (stats != null && !stats.isEmpty()) {
                          SortedMap<Long, UsageStats> map = new TreeMap<>();
                          for (UsageStats s : stats) {
                              map.put(s.getLastTimeUsed(), s);
                          }
                          if (!map.isEmpty()) {
                              return map.get(map.lastKey()).getPackageName();
                          }
                      }
                  } catch (Exception e) {}
                  return null;
              }

              private void showLockOverlay(long remainingSec) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Intent i = new Intent(this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      startActivity(i);
                      return;
                  }

                  if (isOverlayShowing) return;

                  try {
                      lockOverlayView = new LinearLayout(this);
                      lockOverlayView.setOrientation(LinearLayout.VERTICAL);
                      lockOverlayView.setGravity(Gravity.CENTER);
                      lockOverlayView.setBackgroundColor(Color.parseColor("#F2060B14"));
                      lockOverlayView.setPadding(60, 60, 60, 60);

                      TextView title = new TextView(this);
                      title.setText("⛔ قفل پیمان اراده فعال است!");
                      title.setTextColor(Color.parseColor("#EF4444"));
                      title.setTextSize(22);
                      title.setGravity(Gravity.CENTER);

                      long m = remainingSec / 60;
                      long s = remainingSec % 60;
                      TextView desc = new TextView(this);
                      desc.setText("\nشما در حال تایمر مطالعه هستید (" + m + " دقیقه و " + s + " ثانیه باقی‌مانده).\nتا پایان پارت مطالعه اجازه ورود به این برنامه را ندارید!\n");
                      desc.setTextColor(Color.WHITE);
                      desc.setTextSize(15);
                      desc.setGravity(Gravity.CENTER);

                      Button backBtn = new Button(this);
                      backBtn.setText("👑 بازگشت به قلمرو مطالعه");
                      backBtn.setBackgroundColor(Color.parseColor("#10B981"));
                      backBtn.setTextColor(Color.parseColor("#022C22"));
                      backBtn.setTextSize(16);
                      backBtn.setPadding(40, 25, 40, 25);
                      backBtn.setOnClickListener(v -> {
                          removeLockOverlay();
                          Intent i = new Intent(StudyTimerService.this, MainActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(i);
                      });

                      lockOverlayView.addView(title);
                      lockOverlayView.addView(desc);
                      lockOverlayView.addView(backBtn);

                      int layoutFlag = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                              ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                              : WindowManager.LayoutParams.TYPE_PHONE;

                      WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.MATCH_PARENT,
                              layoutFlag,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT
                      );
                      params.gravity = Gravity.CENTER;

                      windowManager.addView(lockOverlayView, params);
                      isOverlayShowing = true;
                  } catch (Exception e) {}
              }

              private void removeLockOverlay() {
                  if (isOverlayShowing && lockOverlayView != null && windowManager != null) {
                      try {
                          windowManager.removeView(lockOverlayView);
                      } catch (Exception e) {}
                      lockOverlayView = null;
                      isOverlayShowing = false;
                  }
              }

              private void triggerAlarm() {
                  try {
                      Uri alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      if (alarmUri == null) alarmUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      if (activeRingtone != null && activeRingtone.isPlaying()) activeRingtone.stop();
                      activeRingtone = RingtoneManager.getRingtone(getApplicationContext(), alarmUri);
                      if (activeRingtone != null) activeRingtone.play();
                  } catch (Exception e) {}

                  try {
                      Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      if (v != null) v.vibrate(4000);
                  } catch (Exception e) {}

                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.notify(1002, buildNotification("🎉 پارت مطالعه تمام شد! وارد برنامه شو تا زنگ قطع شود و درختت را بکاری."));
                  }
              }

              public static void stopRinging() {
                  try {
                      if (activeRingtone != null && activeRingtone.isPlaying()) {
                          activeRingtone.stop();
                      }
                  } catch (Exception e) {}
              }

              private Notification buildNotification(String text) {
                  Intent i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  int piFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i, piFlags);

                  Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);

                  return b.setContentTitle("پیمان اراده | قلمرو کنکور")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .build();
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "AppLock & Study Timer", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public void onDestroy() {
                  removeLockOverlay();
                  if (handler != null) handler.removeCallbacks(tickRunnable);
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat << EOF > "$MAIN_FILE"
          package $PKG_NAME;

          import android.app.AppOpsManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Process;
          import android.provider.Settings;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setupTrueFullscreen();

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 101);
                  }

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().setBackgroundColor(Color.parseColor("#060b14"));
                      getBridge().getWebView().addJavascriptInterface(new NativeBridge(), "AndroidNative");
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  setupTrueFullscreen();
                  StudyTimerService.stopRinging();
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().resumeTimers();
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      setupTrueFullscreen();
                  }
              }

              private void setupTrueFullscreen() {
                  try {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      window.addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
                      window.setStatusBarColor(Color.parseColor("#060b14"));
                      window.setNavigationBarColor(Color.parseColor("#060b14"));

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          WindowManager.LayoutParams lp = window.getAttributes();
                          lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                          window.setAttributes(lp);
                      }

                      View decorView = window.getDecorView();
                      decorView.setBackgroundColor(Color.parseColor("#060b14"));
                      decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                  } catch (Exception e) {}
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void startStudyTimer(int durationSeconds, String blockedPackagesCsv) {
                      long endTime = System.currentTimeMillis() + (durationSeconds * 1000L);
                      SharedPreferences prefs = getSharedPreferences("PeymanLockPrefs", MODE_PRIVATE);
                      prefs.edit()
                          .putLong("lockEndTime", endTime)
                          .putString("blockedPackages", blockedPackagesCsv)
                          .apply();

                      Intent serviceIntent = new Intent(MainActivity.this, StudyTimerService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  }

                  @JavascriptInterface
                  public void updateBlockedPackages(String blockedPackagesCsv) {
                      SharedPreferences prefs = getSharedPreferences("PeymanLockPrefs", MODE_PRIVATE);
                      prefs.edit().putString("blockedPackages", blockedPackagesCsv).apply();
                  }

                  @JavascriptInterface
                  public void stopStudyTimer() {
                      SharedPreferences prefs = getSharedPreferences("PeymanLockPrefs", MODE_PRIVATE);
                      prefs.edit().putLong("lockEndTime", 0).apply();
                      StudyTimerService.stopRinging();
                      stopService(new Intent(MainActivity.this, StudyTimerService.class));
                  }

                  @JavascriptInterface
                  public boolean hasUsagePermission() {
                      try {
                          AppOpsManager appOps = (AppOpsManager) getSystemService(Context.APP_OPS_SERVICE);
                          int mode = appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), getPackageName());
                          return mode == AppOpsManager.MODE_ALLOWED;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openUsageSettings() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS);
                          intent.setData(Uri.parse("package:" + getPackageName()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception e) {
                          Intent intent = new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      }
                  }

                  @JavascriptInterface
                  public boolean hasOverlayPermission() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          return Settings.canDrawOverlays(MainActivity.this);
                      }
                      return true;
                  }

                  @JavascriptInterface
                  public void openOverlaySettings() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          try {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Exception e) {}
                      }
                  }

                  @JavascriptInterface
                  public String getInstalledAppsJson() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          List<ApplicationInfo> apps = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                          for (ApplicationInfo app : apps) {
                              if (pm.getLaunchIntentForPackage(app.packageName) != null && !app.packageName.equals(getPackageName())) {
                                  JSONObject obj = new JSONObject();
                                  obj.put("pkg", app.packageName);
                                  obj.put("name", pm.getApplicationLabel(app).toString());
                                  arr.put(obj);
                              }
                          }
                      } catch (Exception e) {}
                      return arr.toString();
                  }
              }
          }
          EOF

          sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" \/><uses-permission android:name="android.permission.WAKE_LOCK" \/><uses-permission android:name="android.permission.VIBRATE" \/><uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" \/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" \/><uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" \/><application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:resizeableActivity="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<\/application>/<meta-data android:name="android.max_aspect" android:value="2.5" \/><service android:name=".StudyTimerService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse" \/><\/application>/g' android/app/src/main/AndroidManifest.xml

          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> android/app/build.gradle

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PeymanErade-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
