    <!-- اسکریپت ضدتقلب مطالعه کاغذی -->
    <script>
(function () {
  const PAPER_USAGE_KEY = 'peyman_paper_daily_usage_v2';
  const GAME_STORAGE_KEY = 'willpower_kingdom_zero_v1';
  const MAX_DAILY_PAPER_LOGS = 3;
  const MAX_SESSION_MINS = 600;
  const MAX_SESSION_TESTS = 180;

  let allowNextPaperClick = false;
  let isCurrentlyInPaperModal = false;

  function getTodayPaperUsage() {
    const todayFa = new Date().toLocaleDateString('fa-IR');
    try {
      const data = JSON.parse(localStorage.getItem(PAPER_USAGE_KEY) || '{}');
      if (data.date === todayFa) {
        return { date: todayFa, count: Number(data.count) || 0 };
      }
    } catch (e) {}
    return { date: todayFa, count: 0 };
  }

  function incrementTodayPaperUsage() {
    const usage = getTodayPaperUsage();
    localStorage.setItem(
      PAPER_USAGE_KEY,
      JSON.stringify({ date: usage.date, count: usage.count + 1 })
    );
  }

  function getSelectedStudyMinutesFromDOM() {
    const rangeInput = document.querySelector('input[type="range"]');
    if (rangeInput && rangeInput.value) {
      return parseInt(rangeInput.value, 10) || 45;
    }
    return 45;
  }

  function getRealElapsedMinutesCap() {
    const now = Date.now();
    const todayStart = new Date();
    todayStart.setHours(5, 0, 0, 0);
    let referenceMs = todayStart.getTime();
    let referenceLabel = 'ساعت ۵:۰۰ صبح امروز';

    try {
      const saved = JSON.parse(localStorage.getItem(GAME_STORAGE_KEY) || '{}');
      const sessions = Array.isArray(saved.sessions) ? saved.sessions : [];

      if (sessions.length > 0) {
        let latestSession = sessions[0];
        for (const s of sessions) {
          if ((s.timestampMs || 0) > (latestSession.timestampMs || 0)) {
            latestSession = s;
          }
        }
        if (latestSession && latestSession.timestampMs) {
          referenceMs = latestSession.timestampMs;
          const endClock = latestSession.endTimeStr || latestSession.time || 'پارت قبلی';
          referenceLabel = `پایان آخرین پارت شما (${latestSession.subject} در ساعت ${endClock})`;
        }
      }
    } catch (e) {}

    if (now < referenceMs) {
      const midnight = new Date();
      midnight.setHours(0, 0, 0, 0);
      referenceMs = midnight.getTime();
      referenceLabel = 'ابتدای امروز (۰۰:۰۰)';
    }

    const elapsedRealMins = Math.max(0, Math.floor((now - referenceMs) / 60000));
    return { elapsedRealMins, referenceLabel };
  }

  window.addEventListener(
    'click',
    function (e) {
      const btn = e.target.closest('button');
      if (!btn || !btn.textContent) return;

      const text = btn.textContent;

      if (text.includes('ثبت مطالعه روی کاغذ')) {
        if (allowNextPaperClick) {
          allowNextPaperClick = false;
          isCurrentlyInPaperModal = true;
          return;
        }

        e.stopImmediatePropagation();
        e.preventDefault();

        const usage = getTodayPaperUsage();
        if (usage.count >= MAX_DAILY_PAPER_LOGS) {
          alert(`🔒 پایان سهمیه روزانه:\nشما امروز هر ${MAX_DAILY_PAPER_LOGS} سهمیه «ثبت مطالعه روی کاغذ» خود را استفاده کرده‌اید!\nبرای پارت‌های بعدی حتماً تایمر زنده را روشن کنید.`);
          return;
        }

        const requestedMins = getSelectedStudyMinutesFromDOM();
        const { elapsedRealMins, referenceLabel } = getRealElapsedMinutesCap();

        if (elapsedRealMins < 15) {
          alert(`⛔ قفل ضدتقلب زمان واقعی:\nاز ${referenceLabel} فقط ${elapsedRealMins} دقیقه در دنیای واقعی گذشته است!\nبرای ثبت پارت کاغذی جدید باید حداقل ۱۵ دقیقه از آخرین پارت شما گذشته باشد.`);
          return;
        }

        if (requestedMins > elapsedRealMins) {
          alert(`⛔ خطای محاسباتی زمان واقعی!\n• زمان انتخابی روی اسلایدر: ${requestedMins} دقیقه\n• زمان واقعی گذشته از ${referenceLabel}: فقط ${elapsedRealMins} دقیقه!\nلطفاً اسلایدر زمان پارت را به ${Math.min(120, elapsedRealMins)} دقیقه یا کمتر کاهش دهید.`);
          return;
        }

        const note = prompt(
          `✅ بررسی زمان واقعی تایید شد! (سهمیه امروز: ${usage.count + 1} از ${MAX_DAILY_PAPER_LOGS})\n` +
          `📝 لطفاً نام دقیق مبحث، شماره صفحات و خلاصه نکاتی که روی کاغذ خوانده‌اید را بنویسید (حداقل ۳۰ حرف):`
        );

        if (!note || note.trim().length < 30) {
          alert('❌ ثبت لغو شد! نوشتن توضیح کامل مبحث (حداقل ۳۰ حرف) الزامی است.');
          return;
        }

        allowNextPaperClick = true;
        btn.click();
        return;
      }

      if (
        isCurrentlyInPaperModal &&
        (text.includes('ثبت در کارنامه و کاشت درخت') || text.includes('ثبت مرور و سبز کردن'))
      ) {
        const modalContainer = btn.closest('.fixed.inset-0');
        if (modalContainer) {
          const numInputs = Array.from(modalContainer.querySelectorAll('input[type="number"]'));
          let totalTestsEntered = 0;
          let totalMinsEntered = getSelectedStudyMinutesFromDOM();

          if (numInputs.length >= 7) {
            const rMins = parseInt(numInputs[0].value, 10) || 0;
            const tMins = parseInt(numInputs[1].value, 10) || 0;
            const aMins = parseInt(numInputs[2].value, 10) || 0;
            if (rMins + tMins + aMins > 0) totalMinsEntered = rMins + tMins + aMins;
            totalTestsEntered = parseInt(numInputs[3].value, 10) || 0;
          } else if (numInputs.length >= 4) {
            totalTestsEntered = parseInt(numInputs[0].value, 10) || 0;
          }

          const { elapsedRealMins } = getRealElapsedMinutesCap();

          if (totalMinsEntered > MAX_SESSION_MINS || totalMinsEntered > elapsedRealMins) {
            e.stopImmediatePropagation();
            e.preventDefault();
            alert(`⛔ خطای زمان! حداکثر زمان قابل ثبت بر اساس زمان واقعی سپری‌شده ${elapsedRealMins} دقیقه است.`);
            return;
          }

          if (totalTestsEntered > MAX_SESSION_TESTS) {
            e.stopImmediatePropagation();
            e.preventDefault();
            alert(`⛔ حداکثر تعداد تست مجاز در هر سری ${MAX_SESSION_TESTS} تست است.`);
            return;
          }
        }

        incrementTodayPaperUsage();
        isCurrentlyInPaperModal = false;
      }

      if (text.includes('شروع مطالعه')) {
        isCurrentlyInPaperModal = false;
      }
    },
    true
  );
})();
    </script>

    <!-- اسکریپت AppLock واقعی، پاکسازی نوشته‌های زیر جوی‌استیک و کنترل لمسی -->
    <script>
(function () {
  // ۱. پاکسازی خودکار رادار ۴۵ ثانیه‌ای + مخفی کردن کادر متنی مزاحم زیر جوی‌استیک در دهکده
  function cleanUpMobileUI() {
    // خاموش کردن رادار ۴۵ ثانیه‌ای اگر روشن است
    const buttons = document.querySelectorAll('button');
    for (let i = 0; i < buttons.length; i++) {
      const btn = buttons[i];
      const txt = (btn.textContent || '').trim();
      if (txt === 'فعال حین تایمر' && !btn.dataset.radarDisabled) {
        btn.dataset.radarDisabled = 'true';
        btn.click();
      }
    }

    const allDivs = document.querySelectorAll('div, p');
    for (let i = 0; i < allDivs.length; i++) {
      const el = allDivs[i];
      if (el.children.length > 6) continue;
      const t = (el.textContent || '').trim();

      // مخفی کردن رادار ۴۵ ثانیه‌ای
      if (
        !t.includes('مدت پارت') &&
        (t.includes('رادار حضور خودکار ۴۵ ثانیه‌ای') || t.includes('در فواصل تصادفی رادار ۴۵ ثانیه‌ای'))
      ) {
        el.style.display = 'none';
      }

      // مخفی کردن کادر راهنمای WASD زیر جوی‌استیک در نمای فرمانروا
      if (
        t.includes('قدم‌زدن فرمانروا در شهر و داخل ساختمان‌ها') ||
        t.includes('با کلیدهای WASD در شهر قدم بزنید') ||
        t.includes('جلوی درِ ورودی هر ساختمان')
      ) {
        const hasCameraBtn = el.querySelector('button');
        if (!hasCameraBtn) {
          el.style.display = 'none';
        } else {
          // اگر دکمه تغییر دید اول‌شخص/سوم‌شخص داخل این باکس است، فقط متن‌های مزاحم را مخفی کن و باکس را ببر بالای جوی‌استیک
          el.style.background = 'transparent';
          el.style.border = 'none';
          el.style.boxShadow = 'none';
          el.style.transform = 'translateY(-115px)';
          Array.from(el.children).forEach(child => {
            if (child.tagName !== 'BUTTON' && !child.querySelector('button')) {
              child.style.display = 'none';
            }
          });
        }
      }
    }
  }
  setInterval(cleanUpMobileUI, 300);

  // ۲. مدیریت AppLock واقعی اندروید (Usage Access + Overlay)
  const BLOCKED_STORAGE_KEY = 'peyman_android_blocked_pkgs_v2';
  const fabBtn = document.getElementById('android-blocker-fab');
  const modal = document.getElementById('android-blocker-modal');
  const closeBtn = document.getElementById('close-blocker-modal');
  const saveBtn = document.getElementById('save-blocker-btn');
  const testLockBtn = document.getElementById('test-lock-btn');
  const openUsageBtn = document.getElementById('open-usage-btn');
  const openOverlayBtn = document.getElementById('open-overlay-btn');
  const stopAlarmBtn = document.getElementById('stop-alarm-btn');
  const usagePermBox = document.getElementById('usage-perm-box');
  const usagePermText = document.getElementById('usage-perm-text');
  const overlayPermBox = document.getElementById('overlay-perm-box');
  const overlayPermText = document.getElementById('overlay-perm-text');
  const appListContainer = document.getElementById('blocker-app-list');

  let installedAppsLoaded = false;

  function loadInstalledAppsFromPhone() {
    if (installedAppsLoaded) return;
    if (!window.AndroidNative || typeof window.AndroidNative.getInstalledAppsJson !== 'function') return;
    try {
      const jsonStr = window.AndroidNative.getInstalledAppsJson();
      const apps = JSON.parse(jsonStr || '[]');
      if (apps.length > 0) {
        installedAppsLoaded = true;
        const savedCsv = getSavedBlockedCsv();
        apps.forEach(app => {
          // اگر از قبل در لیست پیش‌فرض نبود، به لیست اضافه کن
          if (!appListContainer.querySelector(`input[value*="${app.pkg}"]`)) {
            const lbl = document.createElement('label');
            lbl.className = 'app-item';
            const isChecked = savedCsv.includes(app.pkg) ? 'checked' : '';
            lbl.innerHTML = `<input type="checkbox" value="${app.pkg}" ${isChecked}> 📱 ${app.name}`;
            appListContainer.appendChild(lbl);
          }
        });
      }
    } catch (e) {}
  }

  function getSavedBlockedCsv() {
    const saved = localStorage.getItem(BLOCKED_STORAGE_KEY);
    if (saved !== null) return saved;
    const checks = Array.from(document.querySelectorAll('#blocker-app-list input:checked'));
    return checks.map(c => c.value).join(',');
  }

  function refreshPermissionsUI() {
    loadInstalledAppsFromPhone();
    if (!window.AndroidNative) return;

    const hasUsage = window.AndroidNative.hasUsagePermission && window.AndroidNative.hasUsagePermission();
    const hasOverlay = window.AndroidNative.hasOverlayPermission && window.AndroidNative.hasOverlayPermission();

    if (hasUsage) {
      usagePermBox.style.borderColor = '#10b981';
      usagePermText.style.color = '#34d399';
      usagePermText.textContent = '✅ ۱. مجوز تشخیص برنامه بازشده (Usage Access) فعال است.';
      openUsageBtn.textContent = 'فعال شد';
    } else {
      usagePermBox.style.borderColor = '#f59e0b';
      usagePermText.style.color = '#fbbf24';
      usagePermText.textContent = '⚠️ ۱. مجوز تشخیص برنامه بازشده خاموش است (الزامی):';
      openUsageBtn.textContent = 'باز کردن تنظیمات';
    }

    if (hasOverlay) {
      overlayPermBox.style.borderColor = '#10b981';
      overlayPermText.style.color = '#34d399';
      overlayPermText.textContent = '✅ ۲. مجوز نمایش قفل روی برنامه‌ها (Appear on Top) فعال است.';
      openOverlayBtn.textContent = 'فعال شد';
    } else {
      overlayPermBox.style.borderColor = '#f59e0b';
      overlayPermText.style.color = '#fbbf24';
      overlayPermText.textContent = '⚠️ ۲. مجوز نمایش صفحه قفل روی اپ‌ها خاموش است (الزامی):';
      openOverlayBtn.textContent = 'باز کردن تنظیمات';
    }
  }

  // وقتی کاربر از صفحه تنظیمات گوشی برمی‌گردد داخل بازی، وضعیت مجوزها آپدیت شود
  window.addEventListener('focus', refreshPermissionsUI);
  document.addEventListener('visibilitychange', refreshPermissionsUI);

  fabBtn.addEventListener('click', function () {
    refreshPermissionsUI();
    modal.style.display = 'flex';
  });

  closeBtn.addEventListener('click', function () {
    modal.style.display = 'none';
  });

  openUsageBtn.addEventListener('click', function () {
    if (window.AndroidNative && window.AndroidNative.openUsageSettings) {
      window.AndroidNative.openUsageSettings();
    }
  });

  openOverlayBtn.addEventListener('click', function () {
    if (window.AndroidNative && window.AndroidNative.openOverlaySettings) {
      window.AndroidNative.openOverlaySettings();
    }
  });

  function saveSelectedApps() {
    const checks = Array.from(document.querySelectorAll('#blocker-app-list input:checked'));
    const csv = checks.map(c => c.value).join(',');
    localStorage.setItem(BLOCKED_STORAGE_KEY, csv);
    if (window.AndroidNative && window.AndroidNative.updateBlockedPackages) {
      window.AndroidNative.updateBlockedPackages(csv);
    }
    return csv;
  }

  saveBtn.addEventListener('click', function () {
    saveSelectedApps();
    modal.style.display = 'none';
  });

  // دکمه تست ۱ دقیقه‌ای قفل برای اطمینان کاربر
  testLockBtn.addEventListener('click', function () {
    const csv = saveSelectedApps();
    if (!window.AndroidNative) return;
    if (!window.AndroidNative.hasUsagePermission()) {
      window.AndroidNative.openUsageSettings();
      return;
    }
    if (!window.AndroidNative.hasOverlayPermission()) {
      window.AndroidNative.openOverlaySettings();
      return;
    }
    window.AndroidNative.startStudyTimer(60, csv);
    modal.style.display = 'none';
    alert('🔒 قفل آزمایشی برای ۱ دقیقه فعال شد! الان از بازی خارج شو و یکی از برنامه‌های تیک‌خورده (مثل تلگرام یا اینستاگرام) را باز کن تا صفحه قفل را ببینی.');
  });

  stopAlarmBtn.addEventListener('click', function () {
    if (window.AndroidNative && window.AndroidNative.stopStudyTimer) {
      window.AndroidNative.stopStudyTimer();
    }
  });

  // اتصال مستقیم به دکمه «شروع مطالعه» داخل بازی
  window.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn || !btn.textContent) return;
    const txt = btn.textContent;

    if (txt.includes('دانلود دستیار ویندوز') || txt.includes('.bat')) {
      e.preventDefault();
      e.stopPropagation();
      refreshPermissionsUI();
      modal.style.display = 'flex';
      return;
    }

    if (txt.includes('شروع مطالعه')) {
      if (window.AndroidNative) {
        // اگر مجوز Usage Access یا Overlay را نداده، مستقیم ببرش داخل تنظیمات گوشی!
        if (!window.AndroidNative.hasUsagePermission()) {
          e.preventDefault();
          e.stopPropagation();
          alert('🛡️ برای فعال شدن قفل برنامه‌های مزاحم، الان صفحه تنظیمات باز می‌شود؛ اسم «پیمان اراده» را پیدا کن و تیک مجوزش را روشن کن.');
          window.AndroidNative.openUsageSettings();
          return;
        }
        if (!window.AndroidNative.hasOverlayPermission()) {
          e.preventDefault();
          e.stopPropagation();
          alert('🛡️ لطفاً مجوز «نمایش روی برنامه‌های دیگر» را هم برای پیمان اراده روشن کن تا بتواند روی برنامه‌های مزاحم قفل بیندازد.');
          window.AndroidNative.openOverlaySettings();
          return;
        }

        const rangeInput = document.querySelector('input[type="range"]');
        const mins = rangeInput && rangeInput.value ? (parseInt(rangeInput.value, 10) || 45) : 45;
        const durationSec = mins * 60;
        const blockedCsv = saveSelectedApps();
        window.AndroidNative.startStudyTimer(durationSec, blockedCsv);
      }
    }

    if (txt.includes('توقف') || txt.includes('لغو') || txt.includes('ثبت در کارنامه')) {
      if (window.AndroidNative && window.AndroidNative.stopStudyTimer) {
        window.AndroidNative.stopStudyTimer();
      }
    }
  }, true);

  // ۳. جوی‌استیک کالاف دیوتی + چرخش روان سه‌بعدی
  const joyZone = document.getElementById('cod-joystick-zone');
  const joyStick = document.getElementById('cod-joystick-stick');

  const KEY_MAP = {
    w: { key: 'w', code: 'KeyW', keyCode: 87 },
    s: { key: 's', code: 'KeyS', keyCode: 83 },
    a: { key: 'a', code: 'KeyA', keyCode: 65 },
    d: { key: 'd', code: 'KeyD', keyCode: 68 },
    shift: { key: 'Shift', code: 'ShiftLeft', keyCode: 16 }
  };

  const activeKeys = { w: false, a: false, s: false, d: false, shift: false };

  function fireKey(type, k) {
    const info = KEY_MAP[k];
    if (!info) return;
    const ev = new KeyboardEvent(type, {
      key: info.key,
      code: info.code,
      keyCode: info.keyCode,
      which: info.keyCode,
      bubbles: true,
      cancelable: true
    });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  }

  function updateMovementKeys(newState) {
    for (const k of ['w', 'a', 's', 'd', 'shift']) {
      if (newState[k] && !activeKeys[k]) {
        activeKeys[k] = true;
        fireKey('keydown', k);
      } else if (!newState[k] && activeKeys[k]) {
        activeKeys[k] = false;
        fireKey('keyup', k);
      }
    }
  }

  function releaseAllKeys() {
    updateMovementKeys({ w: false, a: false, s: false, d: false, shift: false });
  }

  function checkVillageMode() {
    const bodyText = document.body ? document.body.innerText : '';
    const isInRulerWalk =
      bodyText.includes('خروج از نمای فرمانروا') ||
      bodyText.includes('قدم‌زدن فرمانروا');
    const hasOpenModal = !!document.querySelector('.fixed.inset-0:not(:has(canvas))');

    const shouldShow = isInRulerWalk && !hasOpenModal;
    joyZone.style.display = shouldShow ? 'block' : 'none';

    if (!shouldShow) releaseAllKeys();
  }
  setInterval(checkVillageMode, 300);

  let joyTouchId = null;
  const maxRadius = 42;

  function handleJoystickMove(clientX, clientY) {
    const rect = joyZone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;
    const dist = Math.hypot(dx, dy);

    if (dist > maxRadius) {
      dx = (dx / dist) * maxRadius;
      dy = (dy / dist) * maxRadius;
    }

    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    const threshold = 10;
    updateMovementKeys({
      w: dy < -threshold,
      s: dy > threshold,
      a: dx < -threshold,
      d: dx > threshold,
      shift: dist > maxRadius * 0.78
    });
  }

  joyZone.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    e.preventDefault();
    const touch = e.changedTouches[0];
    joyTouchId = touch.identifier;
    handleJoystickMove(touch.clientX, touch.clientY);
  }, { passive: false });

  joyZone.addEventListener('touchmove', function (e) {
    e.stopPropagation();
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        break;
      }
    }
  }, { passive: false });

  function endJoystick(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyTouchId = null;
        joyStick.style.transform = 'translate(-50%, -50%)';
        releaseAllKeys();
        break;
      }
    }
  }
  joyZone.addEventListener('touchend', endJoystick, { passive: false });
  joyZone.addEventListener('touchcancel', endJoystick, { passive: false });

  let lookTouchId = null;
  let lastLookX = 0;
  let lastLookY = 0;
  let lastPinchDist = 0;

  function dispatchSyntheticMouse(target, type, x, y, dx, dy, buttons) {
    const ev = new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      view: window,
      clientX: x,
      clientY: y,
      screenX: x,
      screenY: y,
      movementX: dx || 0,
      movementY: dy || 0,
      button: 0,
      buttons: buttons
    });
    target.dispatchEvent(ev);
  }

  document.addEventListener('touchstart', function (e) {
    const canvas = e.target.closest('canvas');
    if (!canvas) return;

    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinchDist = Math.hypot(dx, dy);
      return;
    }

    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier !== joyTouchId && lookTouchId === null) {
        lookTouchId = t.identifier;
        lastLookX = t.clientX;
        lastLookY = t.clientY;
        dispatchSyntheticMouse(canvas, 'mousedown', t.clientX, t.clientY, 0, 0, 1);
        break;
      }
    }
  }, { passive: false });

  document.addEventListener('touchmove', function (e) {
    const canvas = document.querySelector('canvas');
    if (!canvas) return;

    if (e.touches.length === 2 && joyTouchId === null) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (lastPinchDist > 0) {
        const delta = (lastPinchDist - dist) * 2.2;
        const wheelEv = new WheelEvent('wheel', {
          deltaY: delta,
          clientX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          clientY: (e.touches[0].clientY + e.touches[1].clientY) / 2,
          bubbles: true,
          cancelable: true
        });
        canvas.dispatchEvent(wheelEv);
      }
      lastPinchDist = dist;
      return;
    }

    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === lookTouchId) {
        if (e.target.closest('canvas')) e.preventDefault();
        const dx = (t.clientX - lastLookX) * 1.35;
        const dy = (t.clientY - lastLookY) * 1.35;
        lastLookX = t.clientX;
        lastLookY = t.clientY;
        dispatchSyntheticMouse(canvas, 'mousemove', t.clientX, t.clientY, dx, dy, 1);
        break;
      }
    }
  }, { passive: false });

  function endLookTouch(e) {
    const canvas = document.querySelector('canvas');
    lastPinchDist = 0;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === lookTouchId) {
        lookTouchId = null;
        if (canvas) dispatchSyntheticMouse(canvas, 'mouseup', t.clientX, t.clientY, 0, 0, 0);
        break;
      }
    }
  }
  document.addEventListener('touchend', endLookTouch, { passive: false });
  document.addEventListener('touchcancel', endLookTouch, { passive: false });
})();
    </script>
  </body>
