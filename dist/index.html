    <style>
      /* ۱. حذف کامل نوار سفید/خاکستری دور صفحه و اسکرول‌بارهای زشت */
      html, body, #root {
        background-color: #060b14 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
        overscroll-behavior: none !important;
        user-select: none !important;

        -webkit-touch-callout: none !important;

      *::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        display: none !important;
        background: transparent !important;
      }
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        -webkit-tap-highlight-color: transparent !important;
      }

      input, textarea {
        user-select: text !important;
        -webkit-user-select: text !important;
      }

      canvas {
        touch-action: none !important;
        display: block !important;
      }

      /* ۲. تنظیم سایز منوها و نوارها در موبایل (حالت افقی) تا روی هم نیفتند */
      @media screen and (max-width: 1024px), screen and (max-height: 600px) {
        html {
          font-size: 10px !important;
        }
      }
      @media screen and (max-height: 430px) {
        html {
          font-size: 9px !important;
        }
      }

      /* ۳. رفع مشکل اسکرول نشدن پنجره ثبت تست و سایر مودال‌ها */
      .fixed.inset-0:not(:has(canvas)) {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        align-items: flex-start !important;
        padding-top: 10px !important;
        padding-bottom: 40px !important;
      }

      .fixed.inset-0:not(:has(canvas)) > div {
        max-height: none !important;
        margin: 8px auto 36px auto !important;
        touch-action: pan-y !important;
      }

      [class*="overflow-y-auto"], [class*="max-h-"] {
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
      }

      [class*="overflow-x-auto"] {

      /* ۴. استایل جوی‌استیک کالاف دیوتی برای حرکت در دهکده */
      #cod-joystick-zone {
        position: fixed;
        bottom: 22px;

      #cod-joystick-base {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(6, 11, 20, 0.65) 100%);
        border: 2px solid rgba(16, 185, 129, 0.55);
        box-shadow: 0 0 18px rgba(16, 185, 129, 0.25), inset 0 0 12px rgba(16, 185, 129, 0.15);

      /* فلش‌های راهنمای چهار جهت روی جوی‌استیک */

      /* دکمه پرش / اکشن (Space) کنار جوی‌استیک */

    <!-- اسکریپت ضدتقلب مطالعه کاغذی -->
    <script>
(function () {
  const PAPER_USAGE_KEY = 'peyman_paper_daily_usage_v2';
  const GAME_STORAGE_KEY = 'willpower_kingdom_zero_v1';
  const MAX_DAILY_PAPER_LOGS = 3;
  const MAX_SESSION_MINS = 600;
  const MAX_SESSION_TESTS = 180;

  let allowNextPaperClick = false;
  let isCurrentlyInPaperModal = false;
  let currentRealElapsedCap = 600;
  let currentReferenceLabel = 'ساعت ۵:۰۰ صبح امروز';

  function getTodayPaperUsage() {
    const todayFa = new Date().toLocaleDateString('fa-IR');
    try {
      const data = JSON.parse(localStorage.getItem(PAPER_USAGE_KEY) || '{}');
      if (data.date === todayFa) {
        return { date: todayFa, count: Number(data.count) || 0 };
      }
    } catch (e) {}
    return { date: todayFa, count: 0 };
  }

  function incrementTodayPaperUsage() {
    const usage = getTodayPaperUsage();
    localStorage.setItem(
      PAPER_USAGE_KEY,
      JSON.stringify({ date: usage.date, count: usage.count + 1 })
    );
  }

  function getSelectedStudyMinutesFromDOM() {
    const rangeInput = document.querySelector('input[type="range"]');
    if (rangeInput && rangeInput.value) {
      return parseInt(rangeInput.value, 10) || 45;
    }
    return 45;
  }

  function getRealElapsedMinutesCap() {
    const now = Date.now();
    const todayStart = new Date();
    todayStart.setHours(5, 0, 0, 0);
    let referenceMs = todayStart.getTime();
    let referenceLabel = 'ساعت ۵:۰۰ صبح امروز';

    try {
      const saved = JSON.parse(localStorage.getItem(GAME_STORAGE_KEY) || '{}');
      const sessions = Array.isArray(saved.sessions) ? saved.sessions : [];

      if (sessions.length > 0) {
        let latestSession = sessions[0];
        for (const s of sessions) {
          if ((s.timestampMs || 0) > (latestSession.timestampMs || 0)) {
            latestSession = s;
          }
        }
        if (latestSession && latestSession.timestampMs) {
          referenceMs = latestSession.timestampMs;
          const endClock = latestSession.endTimeStr || latestSession.time || 'پارت قبلی';
          referenceLabel = `پایان آخرین پارت شما (${latestSession.subject} در ساعت ${endClock})`;
        }
      }
    } catch (e) {}

    if (now < referenceMs) {
      const midnight = new Date();
      midnight.setHours(0, 0, 0, 0);
      referenceMs = midnight.getTime();
      referenceLabel = 'ابتدای امروز (۰۰:۰۰)';
    }

    const elapsedRealMins = Math.max(0, Math.floor((now - referenceMs) / 60000));
    return {
      elapsedRealMins,
      referenceLabel,
    };
  }

  window.addEventListener(
    'click',
    function (e) {
      const btn = e.target.closest('button');
      if (!btn || !btn.textContent) return;

      const text = btn.textContent;

      if (text.includes('ثبت مطالعه روی کاغذ')) {
        if (allowNextPaperClick) {
          allowNextPaperClick = false;
          isCurrentlyInPaperModal = true;
          return;
        }

        e.stopImmediatePropagation();
        e.preventDefault();

        const usage = getTodayPaperUsage();

        if (usage.count >= MAX_DAILY_PAPER_LOGS) {
          alert(
            `🔒 پایان سهمیه روزانه:\nشما امروز هر ${MAX_DAILY_PAPER_LOGS} سهمیه «ثبت مطالعه روی کاغذ» خود را استفاده کرده‌اید!\nبرای پارت‌های بعدی حتماً تایمر زنده را روشن کنید.`
          );
          return;
        }

        const requestedMins = getSelectedStudyMinutesFromDOM();
        const { elapsedRealMins, referenceLabel } = getRealElapsedMinutesCap();
        currentRealElapsedCap = Math.min(MAX_SESSION_MINS, elapsedRealMins);
        currentReferenceLabel = referenceLabel;

        if (elapsedRealMins < 15) {
          alert(
            `⛔ قفل ضدتقلب زمان واقعی:\nاز ${referenceLabel} فقط ${elapsedRealMins} دقیقه در دنیای واقعی گذشته است!\nبرای ثبت پارت کاغذی جدید باید حداقل ۱۵ دقیقه از آخرین پارت شما در دنیای واقعی گذشته باشد.`
          );
          return;
        }

        if (requestedMins > elapsedRealMins) {
          alert(
            `⛔ خطای محاسباتی زمان واقعی!\n\n` +
            `• زمان انتخابی شما روی اسلایدر: ${requestedMins} دقیقه\n` +
            `• زمان واقعی گذشته از ${referenceLabel}: فقط ${elapsedRealMins} دقیقه!\n\n` +
            `شما نمی‌توانید بیشتر از زمانی که در واقعیت گذشته است (${elapsedRealMins} دقیقه) مطالعه ثبت کنید. لطفاً ابتدا اسلایدر زمان پارت را به ${Math.min(120, elapsedRealMins)} دقیقه یا کمتر کاهش دهید.`
          );
          return;
        }

        if (requestedMins > MAX_SESSION_MINS) {
          alert(
            `⛔ سقف زمان مجاز:\nدر هر نوبت نمی‌توانید بیشتر از ۱۰ ساعت (${MAX_SESSION_MINS} دقیقه) مطالعه ثبت کنید.`
          );
          return;
        }

        const note = prompt(
          `✅ بررسی زمان واقعی تایید شد! (سهمیه امروز: ${usage.count + 1} از ${MAX_DAILY_PAPER_LOGS})\n` +
          `• زمان واقعی گذشته از ${referenceLabel}: ${elapsedRealMins} دقیقه\n` +
          `• سقف مجاز هر نوبت: حداکثر ۱۰ ساعت و حداکثر ${MAX_SESSION_TESTS} تست\n\n` +
          `📝 لطفاً نام دقیق مبحث، شماره صفحات و خلاصه نکاتی که روی کاغذ خوانده‌اید را بنویسید (حداقل ۳۰ حرف):`
        );

        if (!note || note.trim().length < 30) {
          alert(
            '❌ ثبت لغو شد! برای باز شدن قفل ثبت کاغذی، نوشتن توضیح کامل مبحث (حداقل ۳۰ حرف) الزامی است.'
          );
          return;
        }

        allowNextPaperClick = true;
        btn.click();
        return;
      }

      if (
        isCurrentlyInPaperModal &&
        (text.includes('ثبت در کارنامه و کاشت درخت') || text.includes('ثبت مرور و سبز کردن'))
      ) {
        const modalContainer = btn.closest('.fixed.inset-0');
        if (modalContainer) {
          const numInputs = Array.from(modalContainer.querySelectorAll('input[type="number"]'));

          let totalTestsEntered = 0;
          let totalMinsEntered = getSelectedStudyMinutesFromDOM();

          if (numInputs.length >= 7) {
            const rMins = parseInt(numInputs[0].value, 10) || 0;
            const tMins = parseInt(numInputs[1].value, 10) || 0;
            const aMins = parseInt(numInputs[2].value, 10) || 0;
            if (rMins + tMins + aMins > 0) {
              totalMinsEntered = rMins + tMins + aMins;
            }
            totalTestsEntered = parseInt(numInputs[3].value, 10) || 0;
          } else if (numInputs.length >= 4) {
            totalTestsEntered = parseInt(numInputs[0].value, 10) || 0;
          }

          const { elapsedRealMins, referenceLabel } = getRealElapsedMinutesCap();

          if (totalMinsEntered > MAX_SESSION_MINS) {
            e.stopImmediatePropagation();
            e.preventDefault();
            alert(
              `⛔ خطای سقف زمان:\nشما نمی‌توانید در یک نوبت بیشتر از ۱۰ ساعت (${MAX_SESSION_MINS} دقیقه) مطالعه ثبت کنید! (مقدار واردشده: ${totalMinsEntered} دقیقه)`
            );
            return;
          }

          if (totalMinsEntered > elapsedRealMins) {
            e.stopImmediatePropagation();
            e.preventDefault();
            alert(
              `⛔ خطای فیزیک زمان!\nاز ${referenceLabel} تا الان فقط ${elapsedRealMins} دقیقه در دنیای واقعی گذشته است!\nشما نمی‌توانید ${totalMinsEntered} دقیقه مطالعه ثبت کنید. لطفاً زمان را به حداکثر ${elapsedRealMins} دقیقه کاهش دهید.`
            );
            return;
          }

          if (totalTestsEntered > MAX_SESSION_TESTS) {
            e.stopImmediatePropagation();
            e.preventDefault();
            alert(
              `⛔ خطای سقف تعداد تست!\nدر ثبت مطالعه روی کاغذ، حداکثر تعداد تست مجاز در هر سری ${MAX_SESSION_TESTS} تست است (عدد واردشده توسط شما: ${totalTestsEntered} تست).\nلطفاً تعداد کل تست‌ها را به ${MAX_SESSION_TESTS} یا کمتر اصلاح کنید.`
            );
            return;
          }
        }

        incrementTodayPaperUsage();
        isCurrentlyInPaperModal = false;
      }

      if (text.includes('شروع مطالعه')) {
        isCurrentlyInPaperModal = false;
      }
    },
    true
  );
})();
    </script>

    <!-- اسکریپت جوی‌استیک کالاف دیوتی + چرخش و زوم روان لمسی سه‌بعدی -->
    <script>
(function () {
  const joyZone = document.getElementById('cod-joystick-zone');
  const joyStick = document.getElementById('cod-joystick-stick');
  const actionBtn = document.getElementById('cod-action-btn');

  const KEY_MAP = {
    w: { key: 'w', code: 'KeyW', keyCode: 87 },
    s: { key: 's', code: 'KeyS', keyCode: 83 },
    a: { key: 'a', code: 'KeyA', keyCode: 65 },
    d: { key: 'd', code: 'KeyD', keyCode: 68 },
    shift: { key: 'Shift', code: 'ShiftLeft', keyCode: 16 },
    space: { key: ' ', code: 'Space', keyCode: 32 }
  };

  const activeKeys = { w: false, a: false, s: false, d: false, shift: false };

  function fireKey(type, k) {
    const info = KEY_MAP[k];
    if (!info) return;
    const ev = new KeyboardEvent(type, {
      key: info.key,
      code: info.code,
      keyCode: info.keyCode,
      which: info.keyCode,
      bubbles: true,
      cancelable: true
    });
    window.dispatchEvent(ev);
    document.dispatchEvent(ev);
  }

  function updateMovementKeys(newState) {
    for (const k of ['w', 'a', 's', 'd', 'shift']) {
      if (newState[k] && !activeKeys[k]) {
        activeKeys[k] = true;
        fireKey('keydown', k);
      } else if (!newState[k] && activeKeys[k]) {
        activeKeys[k] = false;
        fireKey('keyup', k);
      }
    }
  }

  function releaseAllKeys() {
    updateMovementKeys({ w: false, a: false, s: false, d: false, shift: false });
  }

  // ۱. تشخیص خودکار حضور در حالت قدم‌زدن در دهکده (نمای فرمانروا)
  function checkVillageMode() {
    const bodyText = document.body ? document.body.innerText : '';
    const isInRulerWalk =
      bodyText.includes('خروج از نمای فرمانروا') ||
      bodyText.includes('قدم‌زدن فرمانروا');
    const hasOpenModal = !!document.querySelector('.fixed.inset-0:not(:has(canvas))');

    const shouldShow = isInRulerWalk && !hasOpenModal;
    joyZone.style.display = shouldShow ? 'block' : 'none';
    actionBtn.style.display = shouldShow ? 'flex' : 'none';

    if (!shouldShow) {
      releaseAllKeys();
    }
  }
  setInterval(checkVillageMode, 350);

  // ۲. منطق لمس جوی‌استیک ۳۶۰ درجه (با پشتیبانی از چندلمس هم‌زمان)
  let joyTouchId = null;
  const maxRadius = 40;

  function handleJoystickMove(clientX, clientY) {
    const rect = joyZone.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;
    const dist = Math.hypot(dx, dy);

    if (dist > maxRadius) {
      dx = (dx / dist) * maxRadius;
      dy = (dy / dist) * maxRadius;
    }

    joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

    const threshold = 10;
    const nextState = {
      w: dy < -threshold,
      s: dy > threshold,
      a: dx < -threshold,
      d: dx > threshold,
      shift: dist > maxRadius * 0.78
    };
    updateMovementKeys(nextState);
  }

  joyZone.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    e.preventDefault();
    const touch = e.changedTouches[0];
    joyTouchId = touch.identifier;
    handleJoystickMove(touch.clientX, touch.clientY);
  }, { passive: false });

  joyZone.addEventListener('touchmove', function (e) {
    e.stopPropagation();
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        break;
      }
    }
  }, { passive: false });

  function endJoystick(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyTouchId = null;
        joyStick.style.transform = 'translate(-50%, -50%)';
        releaseAllKeys();
        break;
      }
    }
  }
  joyZone.addEventListener('touchend', endJoystick, { passive: false });
  joyZone.addEventListener('touchcancel', endJoystick, { passive: false });

  // دکمه Space (پرش / تایید رادار)
  actionBtn.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    e.preventDefault();
    fireKey('keydown', 'space');
  }, { passive: false });

  actionBtn.addEventListener('touchend', function (e) {
    e.stopPropagation();
    e.preventDefault();
    fireKey('keyup', 'space');
  }, { passive: false });

  // ۳. چرخش روان دوربین با انگشت راست و زوم دو انگشتی روی محیط سه‌بعدی
  let lookTouchId = null;
  let lastLookX = 0;
  let lastLookY = 0;
  let lastPinchDist = 0;

  function dispatchSyntheticMouse(target, type, x, y, dx, dy, buttons) {
    const ev = new MouseEvent(type, {
      bubbles: true,
      cancelable: true,
      view: window,
      clientX: x,
      clientY: y,
      screenX: x,
      screenY: y,
      movementX: dx || 0,
      movementY: dy || 0,
      button: 0,
      buttons: buttons
    });
    target.dispatchEvent(ev);
  }

  document.addEventListener('touchstart', function (e) {
    const canvas = e.target.closest('canvas');
    if (!canvas) return;

    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinchDist = Math.hypot(dx, dy);
      return;
    }

    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier !== joyTouchId && lookTouchId === null) {
        lookTouchId = t.identifier;
        lastLookX = t.clientX;
        lastLookY = t.clientY;
        dispatchSyntheticMouse(canvas, 'mousedown', t.clientX, t.clientY, 0, 0, 1);
        break;
      }
    }
  }, { passive: false });

  document.addEventListener('touchmove', function (e) {
    const canvas = document.querySelector('canvas');
    if (!canvas) return;

    // زوم دو انگشتی (Pinch to Zoom)
    if (e.touches.length === 2 && joyTouchId === null) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (lastPinchDist > 0) {
        const delta = (lastPinchDist - dist) * 2.2;
        const wheelEv = new WheelEvent('wheel', {
          deltaY: delta,
          clientX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          clientY: (e.touches[0].clientY + e.touches[1].clientY) / 2,
          bubbles: true,
          cancelable: true
        });
        canvas.dispatchEvent(wheelEv);
      }
      lastPinchDist = dist;
      return;
    }

    // چرخش روان تک‌انگشتی
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === lookTouchId) {
        if (e.target.closest('canvas')) {
          e.preventDefault();
        }
        const dx = (t.clientX - lastLookX) * 1.35;
        const dy = (t.clientY - lastLookY) * 1.35;
        lastLookX = t.clientX;
        lastLookY = t.clientY;
        dispatchSyntheticMouse(canvas, 'mousemove', t.clientX, t.clientY, dx, dy, 1);
        break;
      }
    }
  }, { passive: false });

  function endLookTouch(e) {
    const canvas = document.querySelector('canvas');
    lastPinchDist = 0;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === lookTouchId) {
        lookTouchId = null;
        if (canvas) {
          dispatchSyntheticMouse(canvas, 'mouseup', t.clientX, t.clientY, 0, 0, 0);
        }
        break;
      }
    }
  }
  document.addEventListener('touchend', endLookTouch, { passive: false });
  document.addEventListener('touchcancel', endLookTouch, { passive: false });
})();
    </script>
  </body>
